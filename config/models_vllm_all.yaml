gateway:
  host: 0.0.0.0
  port: 18001
  vllm_binary: /home/wuxinze/vllm-qwen3-env/bin/vllm
  startup_timeout: 900
  request_timeout: 300
  drain_timeout: 120
  poll_interval: 1
  reaper_interval: 15
  max_queue_size_per_model: 32

models:
  - id: qwen3:0.6b-vllm
    backend: managed_vllm
    path: /nfs/wxz/source/huggingface/Qwen3-0.6B
    served_model_name: qwen3:0.6b-vllm
    gpu_group: [1]
    port: 9101
    mode: hot
    priority: 100
    max_model_len: 4096
    max_num_seqs: 4
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.70
    extra_args: ["--dtype", "half", "--trust-remote-code"]

  - id: qwen3.5:0.8b-vllm
