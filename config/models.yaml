gateway:
  host: 0.0.0.0
  port: 18001
  vllm_binary: /tmp/vllm-qwen3-lite-env/bin/vllm
  startup_timeout: 900
  request_timeout: 300
  drain_timeout: 120
  poll_interval: 1
  reaper_interval: 15
  max_queue_size_per_model: 32

models:
  - id: qwen3:0.6b-vllm
    backend: managed_vllm
    path: /nfs/wxz/source/huggingface/Qwen3-0.6B
    served_model_name: qwen3:0.6b-vllm
    gpu_group: [3]
    port: 9101
    mode: warm
    preload: true
    priority: 100
    max_model_len: 4096
    max_num_seqs: 4
    max_num_batched_tokens: 4096
    gpu_memory_utilization: 0.25
    extra_args: ["--dtype", "half", "--trust-remote-code"]

  - id: qwen3:8b-vllm
    backend: managed_vllm
    path: /nfs/wxz/source/huggingface/Qwen3-8B
    served_model_name: qwen3:8b-vllm
    gpu_group: [0, 1]
    port: 9102
    mode: warm
    preload: false
    priority: 90
    max_model_len: 2048
    max_num_seqs: 1
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.70
    tensor_parallel_size: 2
    extra_args: ["--dtype", "half", "--trust-remote-code", "--enforce-eager", "--cpu-offload-gb", "2", "--disable-custom-all-reduce"]

  - id: deepseek-r1:7b-vllm
    backend: managed_vllm
    path: /nfs/wxz/source/huggingface/DeepSeek-R1-Distill-Qwen-7B
    served_model_name: deepseek-r1:7b-vllm
    gpu_group: [0, 1]
    port: 9103
    mode: warm
    preload: false
    priority: 80
    max_model_len: 2048
    max_num_seqs: 1
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.70
    tensor_parallel_size: 2
    extra_args: ["--dtype", "half", "--trust-remote-code", "--enforce-eager", "--cpu-offload-gb", "2", "--disable-custom-all-reduce"]
