services:
  model-gateway:
    build: .
    container_name: model-gateway
    network_mode: host
    ipc: host
    shm_size: 16gb
    privileged: true
    devices:
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidia1:/dev/nvidia1
      - /dev/nvidia2:/dev/nvidia2
      - /dev/nvidia3:/dev/nvidia3
    environment:
      MODEL_GATEWAY_CONFIG: /app/config/models.yaml
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-internal-service-key}
      MODEL_GATEWAY_ADMIN_KEY: ${MODEL_GATEWAY_ADMIN_KEY:-admin-key}
      VLLM_BIN: ${VLLM_BIN:-/tmp/vllm-qwen3-lite-env/bin/vllm}
      VLLM_CUDA_HOME: ${VLLM_CUDA_HOME:-/usr/local/cuda}
    volumes:
      - ./config/models.yaml:/app/config/models.yaml:ro
      - /nfs:/nfs:ro
      - /tmp/vllm-qwen3-lite-env:/tmp/vllm-qwen3-lite-env:ro
      - /usr/local/cuda:/usr/local/cuda:ro
    restart: unless-stopped
