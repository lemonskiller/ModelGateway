services:
  model-gateway:
    build: .
    network_mode: host
    environment:
      MODEL_GATEWAY_CONFIG: /app/config/models.yaml
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:-}
      MODEL_GATEWAY_ADMIN_KEY: ${MODEL_GATEWAY_ADMIN_KEY:-}
    volumes:
      - ./config/models.yaml:/app/config/models.yaml:ro
    restart: unless-stopped
